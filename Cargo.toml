[package]
name = "yandex-music-rust"
version = "0.2.7"
edition = "2024"
autobins = false

[[bin]]
name = "yandex-music-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "mp3", "flac", "symphonia-aac", "symphonia-isomp4"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tempfile = "3"
discord-rich-presence = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
rodio = { version = "0.21.1", default-features = false, features = ["wav"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
raw-window-handle = "0.6"
windows = { version = "0.54", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "debuginfo"

